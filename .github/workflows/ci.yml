name: Lightweight CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install lightweight test tools
        run: python -m pip install pytest ruff
      - name: Syntax check
        run: python -m compileall -q app.py src tests
      - name: Lint
        run: ruff check .
      - name: Tests
        run: python -m pytest -q
